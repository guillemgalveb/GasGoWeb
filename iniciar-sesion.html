<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Gas&amp;Go</title>
    <link rel="icon" href="assets/images/logo-gg.webp" type="image/webp">
    <link rel="stylesheet" href="assets/css/site.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <script type="module" src="assets/auth/forms.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./" aria-label="Gas&Go, inicio">
          <img src="assets/images/logo-gg.webp" alt="" width="720" height="355">
        </a>
        <nav aria-label="Navegación principal">
          <a href="como-funciona.html">Cómo funciona</a>
          <a href="planes.html">Planes</a>
          <a href="iniciar-sesion.html" aria-current="page">Iniciar sesión</a>
          <a href="registrarse.html" class="nav-register">Registrarse</a>
        </nav>
      </div>
    </header>
    <main class="container auth-main">
      <div class="auth-illustration" aria-hidden="true"></div>
      <section class="auth-card" aria-labelledby="auth-title">
        <h1 id="auth-title">Iniciar sesión</h1>
        <p id="auth-note">Cuenta de prueba. Se guarda en este navegador. Usa un correo de prueba y una contraseña que no utilices en otros sitios.</p>
        <form method="post" data-mode="login" aria-describedby="auth-note">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="username" maxlength="254" placeholder="nombre@ejemplo.com" required>
          <label for="password">Contraseña</label>
          <div class="auth-password">
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
            <button class="auth-reveal" type="button" aria-controls="password" aria-pressed="false" hidden>Mostrar</button>
          </div>
          <button class="auth-submit" type="submit" disabled>Iniciar sesión</button>
          <p class="auth-status" role="status"></p>
        </form>
        <p class="auth-switch">¿Aún no tienes cuenta? <a href="registrarse.html">Registrarse</a></p>
        <div class="auth-session" hidden>
          <p class="auth-greeting"></p>
          <a class="auth-submit" href="./">Volver a la estación</a>
          <button type="button" class="auth-signout">Cerrar sesión</button>
        </div>
        <noscript><p>Activa JavaScript para usar la cuenta de prueba.</p></noscript>
      </section>
    </main>
  </body>
</html>
